 ["TUO de la Ley 29090 (DS 006-2017-VIVIENDA)","Licencias, conformidad de obra y declaratoria de edificación.","https://cdn.www.gob.pe/uploads/document/file/2854408/TUO-%20LEY%2029090.pdf"],
 ["Decreto Legislativo 1426 (2018)","Redacción del artículo 30: regularización 2017 – 17 set. 2018.","https://busquedas.elperuano.pe/dispositivo/NL/1692078-1"],
 ["Decreto Legislativo 1595 (2023)","Nuevo régimen de regularización; entra en vigor tras su reglamento.","https://lpderecho.pe/decreto-legislativo-1595-regularizacion-del-derecho-de-propiedad-de-las-caracteristicas-fisicas-de-los-predios-urbanos-de-habilitaciones-urbanas-y-de-edificaciones/"],
 ["Proyecto de reglamento del DL 1595 (RM 417-2024-VIVIENDA)","Prepublicación para comentarios.","https://www.gob.pe/institucion/vivienda/normas-legales/6144757-417-2024-vivienda"]
];

/* ================== ESTADO ================== */
const SESIONES = MODULOS.flatMap(m => m.sesiones.map(s => ({...s, mod:m})));
const porId = id => SESIONES.find(s => s.id === id);
const CLAVE = "saneamiento-en-ruta:v1";
let P = { t:0, hechas:{}, errores:{}, evals:{}, ultima:null };
try { const g = JSON.parse(localStorage.getItem(CLAVE) || "null"); if (g && typeof g === "object") P = Object.assign(P, g); } catch(e) {}

let refDB = null, colaDB = Promise.resolve(), tDB = null;
function guardar(){
  P.t = Date.now();
  try { localStorage.setItem(CLAVE, JSON.stringify(P)); } catch(e) {}
  if (refDB){ clearTimeout(tDB); tDB = setTimeout(() => { const copia = JSON.parse(JSON.stringify(P)); colaDB = colaDB.then(() => refDB.set(copia)).catch(() => {}); }, 900); }
  pintarBadge();
}
async function iniciarSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progreso");
    const snap = await ref.get();
    if (snap.exists){
      const r = snap.data();
      if (r && (r.t || 0) > (P.t || 0)){ P = Object.assign({ t:0, hechas:{}, errores:{}, evals:{}, ultima:null }, JSON.parse(JSON.stringify(r))); try{ localStorage.setItem(CLAVE, JSON.stringify(P)); }catch(e){} render(); }
    }
    refDB = ref;
    document.getElementById("sync").textContent = "Guardado en tu cuenta";
    if (!snap.exists || ((snap.data()||{}).t || 0) < (P.t || 0)) guardar();
  }catch(e){}
}

let sampleFn = null;
(async () => { try{ if (window.claude && window.claude.use) sampleFn = await claude.use("sample"); }catch(e){ sampleFn = null; } })();

/* ================== UTILIDADES ================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LETRAS = "abcd";
function barajar(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function siguientePendiente(){ return SESIONES.find(s => !P.hechas[s.id]) || null; }
function estadoSesion(s){ const h = P.hechas[s.id]; if (!h) return ['pend','Pendiente']; return h.nota >= 11 ? ['ok','Conforme · ' + h.nota] : ['obs','Observado · ' + h.nota]; }
function cab(titulo, volver){ $("#titulo").textContent = titulo; $("#volver").hidden = !volver; }
function marcarNav(v){ document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v)); }
function pintarBadge(){ const n = Object.keys(P.errores).length; const b = $("#badge"); b.hidden = !n; b.textContent = n; }
window.addEventListener("scroll", () => $("#cab").classList.toggle("borde", scrollY > 6), {passive:true});
$("#volver").onclick = () => { pararVoz(); location.hash = ""; };

/* ================== VISTAS ================== */
function render(){
  pararVoz();
  const h = location.hash.replace("#","");
  if (h.startsWith("sesion-") && porId(h.slice(7))) return abrirSesion(h.slice(7));
  if (h === "glosario") return vistaGlosario();
  if (h === "repaso") return vistaRepaso();
  if (h === "fuentes") return vistaFuentes();
  vistaInicio();
}
window.addEventListener("hashchange", () => { render(); scrollTo(0,0); });

function vistaInicio(){
  cab("Saneamiento en Ruta", false); marcarNav("inicio");
  const hechas = SESIONES.filter(s => P.hechas[s.id]).length, total = SESIONES.length;
  const sig = siguientePendiente();
  let html = `<section class="saludo">
    <span class="eti">Para estudiar en el camino</span>
    <h2>Del lote a la partida, una sesión por viaje</h2>
    <p class="suave">Cada sesión dura unos 7 minutos: lees cuatro fichas, marcas cinco preguntas y, si te queda tiempo, respondes por escrito y en voz alta.</p>
    <div class="avance"><div class="barra"><i style="width:${hechas/total*100}%"></i></div><b>${hechas}/${total}</b></div>
  </section>`;
  if (sig) html += `<button class="continuar" onclick="location.hash='sesion-${sig.id}'">
      <span class="eti">${hechas ? 'Continúa con' : 'Empieza por'} · Módulo ${sig.mod.num}</span>
      <strong>${esc(sig.titulo)}</strong><span class="min">${sig.min} min · ${sig.preguntas.length} preguntas</span></button>`;
  else html += `<div class="ficha"><h3>Terminaste las nueve sesiones</h3><p>Repasa tus errores o vuelve a cualquier sesión para mejorar la nota.</p></div>`;
  MODULOS.forEach(m => {
    html += `<section class="modulo"><header><span class="num">${m.num}</span><h3>${esc(m.titulo)}</h3></header><div class="lista">`;
    m.sesiones.forEach(s => { const [c,t] = estadoSesion(s);
      html += `<button class="ses" onclick="location.hash='sesion-${s.id}'"><span class="txt"><b>${esc(s.titulo)}</b><small>${s.min} min · ${esc(m.sub)}</small></span><span class="estado ${c}">${t}</span></button>`; });
    html += `</div></section>`;
  });
  html += `<p class="suave" style="margin-top:26px;font-size:.88rem">Contenido para estudiar, revisado con la normativa a noviembre de 2026. Antes de presentar un expediente real, confirma el TUPA del distrito y la norma vigente.</p>`;
  app.innerHTML = html;
}

/* ---------- Sesión ---------- */
let S = null;
function abrirSesion(id){
  const s = porId(id);
  if (!S || S.id !== id) S = { id, paso:"leer", qi:0, aciertos:0, orden:null, respondida:false, nuevosErrores:[] };
  P.ultima = id;
  cab(s.titulo, true); marcarNav("inicio");
  pintarPaso();
}
function barraPasos(){
  const pasos = [["leer","Leer"],["marcar","Marcar"],["escribir","Escribir"],["decir","Decir"]];
  const idx = pasos.findIndex(p => p[0] === S.paso);
  return `<div class="pasos">${pasos.map((p,i) => `<span class="${i===idx?'on':(i<idx||S.paso==='fin')?'hecho':''}">${p[1]}</span>`).join("")}</div>`;
}
function pintarPaso(){
  const s = porId(S.id);
  if (S.paso === "leer") return pasoLeer(s);
  if (S.paso === "marcar") return pasoMarcar(s);
  if (S.paso === "escribir") return pasoAbierta(s, "escrita");
  if (S.paso === "decir") return pasoAbierta(s, "oral");
  return pasoFin(s);
}
function irPaso(p){ S.paso = p; pintarPaso(); scrollTo(0,0); }

function pasoLeer(s){
  let html = barraPasos() + `<span class="eti">Módulo ${s.mod.num} · ${esc(s.mod.titulo)}</span><h2>${esc(s.titulo)}</h2>`;
  if ('speechSynthesis' in window) html += `<div class="acciones" style="margin-top:4px"><button class="btn sec" id="voz">Escuchar las fichas</button></div>`;
  s.fichas.forEach((f,i) => {
    html += `<article class="ficha"><span class="n">${i+1}/${s.fichas.length}</span><h3>${f.t}</h3>${f.p.map(x => x.startsWith("<ul")||x.startsWith("<ol") ? x : `<p>${x}</p>`).join("")}`;
    if (f.arbol) html += `<div class="arbol">${f.arbol.map(r => `<div class="rama"><span class="letra">${r[0]}</span><div><b>${r[1]}</b><small>${r[2]}</small><span class="va">${r[3]}</span></div></div>`).join("")}</div>`;
    if (f.ej) html += `<div class="ej">${f.ej.includes('class="eti"') ? '' : '<span class="eti">Ejemplo</span>'}${f.ej}</div>`;
    html += `</article>`;
  });
  if (s.ojo) html += `<div class="ojo"><span class="eti">Ojo</span>${s.ojo}</div>`;
  html += `<div class="acciones"><button class="btn ancho" onclick="irPaso('marcar')">Pasar a las preguntas</button></div>`;
  app.innerHTML = html;
  const bv = $("#voz"); if (bv) bv.onclick = () => alternarVoz(s, bv);
}

function pasoMarcar(s){
  const q = s.preguntas[S.qi];
  if (!S.orden) S.orden = barajar(q.ops.length);
  let html = barraPasos() + `<div class="preg"><span class="eti contador">Pregunta ${S.qi+1} de ${s.preguntas.length}</span><p class="q">${esc(q.q)}</p><div class="ops">`;
  S.orden.forEach((oi,k) => { html += `<button class="op" data-oi="${oi}"><span class="l">${LETRAS[k]})</span><span>${esc(q.ops[oi])}</span></button>`; });
  html += `</div><div id="fb"></div></div>`;
  app.innerHTML = html;
  app.querySelectorAll(".op").forEach(b => b.onclick = () => responder(s, q, +b.dataset.oi, b));
}
function responder(s, q, oi, boton){
  if (S.respondida) return; S.respondida = true;
  const bien = oi === q.ok, qid = S.id + "-" + S.qi;
  if (bien){ S.aciertos++; delete P.errores[qid]; } else { P.errores[qid] = 1; }
  app.querySelectorAll(".op").forEach(b => { b.disabled = true; if (+b.dataset.oi === q.ok) b.classList.add("correcta"); });
  boton.classList.add("elegida", bien ? "bien" : "malo");
  const ultima = S.qi === s.preguntas.length - 1;
  $("#fb").innerHTML = `<div class="expl"><span class="sello ${bien?'ok':'mal'}">${bien?'CONFORME':'OBSERVADO'}</span><p>${esc(q.exp)}</p>
    <div class="acciones" style="margin-bottom:0"><button class="btn ancho" id="sig">${ultima ? 'Ver mi nota' : 'Siguiente'}</button></div></div>`;
  guardar();
  $("#sig").onclick = () => {
    S.respondida = false; S.orden = null;
    if (ultima){
      const nota = Math.round(S.aciertos / s.preguntas.length * 20);
      const previa = P.hechas[S.id];
      P.hechas[S.id] = { nota: previa ? Math.max(previa.nota, nota) : nota, fecha: new Date().toISOString().slice(0,10) };
      S.notaMarcar = nota; guardar(); irPaso("escribir");
    } else { S.qi++; pasoMarcar(s); }
  };
  $("#sig").scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* ---------- Respuesta escrita y oral ---------- */
const MIC = `<span class="mic"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-2.1A7 7 0 0019 12z"/></svg></span>`;
function pasoAbierta(s, tipo){
  const it = s[tipo], k = S.id + "-" + tipo, oral = tipo === "oral";
  let borrador = ""; try { borrador = localStorage.getItem(CLAVE + ":b:" + k) || ""; } catch(e) {}
  let html = barraPasos() + `<div class="preg"><span class="eti">${oral ? 'Explícalo en voz alta' : 'Responde por escrito'}${S.notaMarcar != null ? ' · preguntas: ' + S.notaMarcar + '/20' : ''}</span><p class="q">${esc(it.q)}</p>`;
  const Reco = !window.claude && (window.SpeechRecognition || window.webkitSpeechRecognition);
  if (oral) html += `<div class="consejo-voz">${MIC}<span>${Reco ? 'Toca «Dictar» y habla' : 'Toca el micrófono de tu teclado y habla'} como si estuvieras frente a la persona. Si vas en el bus sin poder hablar, piénsalo en voz baja y luego marca qué puntos dijiste.</span></div>`;
  if (oral && Reco) html += `<div class="acciones" style="margin-top:0"><button class="btn sec" id="dictar">Dictar</button></div>`;
  html += `<textarea id="resp-${k}" placeholder="${oral ? 'Tu explicación dictada aparecerá aquí…' : 'Escribe con tus palabras…'}">${esc(borrador)}</textarea>
    <div class="acciones"><button class="btn ancho" id="revisar">${sampleFn ? 'Revisar con Claude' : 'Comparar con la respuesta modelo'}</button>
    ${oral ? '<button class="btn sec" id="solo">Solo marcar puntos</button>' : ''}<button class="btn bajo" id="saltar">Saltar</button></div>
    <div id="resultado"></div></div>`;
  app.innerHTML = html;
  const ta = $("#resp-" + CSS.escape(k));
  ta.oninput = () => { try { localStorage.setItem(CLAVE + ":b:" + k, ta.value); } catch(e) {} };
  $("#saltar").onclick = () => irPaso(oral ? "fin" : "decir");
  $("#revisar").onclick = () => { const t = ta.value.trim(); if (t.length < 15){ $("#resultado").innerHTML = `<p class="suave">Escribe al menos una o dos frases para poder revisarlo.</p>`; ta.focus(); return; } evaluar(s, tipo, t); };
  const bs = $("#solo"); if (bs) bs.onclick = () => autoevaluar(s, tipo, "");
  const bd = $("#dictar"); if (bd) bd.onclick = () => dictar(bd, ta, Reco);
}
let reco = null;
function dictar(btn, ta, Reco){
  if (reco){ try{ reco.stop(); }catch(e){} return; }
  try{
    reco = new Reco(); reco.lang = "es-PE"; reco.continuous = true; reco.interimResults = true;
    const base = ta.value ? ta.value.replace(/\s*$/, " ") : "";
    let finales = "";
    reco.onresult = ev => { let prov = ""; for (let i = ev.resultIndex; i < ev.results.length; i++){ const r = ev.results[i]; if (r.isFinal) finales += r[0].transcript + " "; else prov += r[0].transcript; } ta.value = base + finales + prov; ta.oninput(); };
    reco.onend = () => { reco = null; btn.textContent = "Dictar"; };
    reco.onerror = ev => { if (ev.error === "not-allowed") btn.hidden = true; };
    reco.start(); btn.textContent = "Detener dictado";
  }catch(e){ reco = null; btn.hidden = true; }
}
let ctlEval = null;
async function evaluar(s, tipo, texto){
  const it = s[tipo], res = $("#resultado"), btn = $("#revisar");
  if (!sampleFn) return autoevaluar(s, tipo, texto);
  btn.disabled = true;
  res.innerHTML = `<div class="pensando"><i></i>Revisando tu respuesta… puede tardar unos segundos.</div>`;
  const prompt = `Eres docente de saneamiento físico-legal de edificaciones en Perú y evalúas a una arquitecta que recién empieza en el rubro y arma expedientes.
Tema de la sesión: ${s.titulo} (módulo ${s.mod.titulo}).
Pregunta: ${it.q}
Tipo de respuesta: ${tipo === "oral" ? "explicación oral dictada por voz (ignora la puntuación y los errores del dictado)" : "respuesta escrita"}.
Puntos clave que una buena respuesta debe tocar:
${it.puntos.map(p => "- " + p).join("\n")}
Respuesta modelo de referencia: ${it.modelo}

Respuesta de la alumna:
"""${texto.slice(0, 4000)}"""

Califica en escala vigesimal (0 a 20; aprueba con 11). Sé cálida, directa y concreta, en español peruano sencillo. No inventes normas, fechas ni montos que no estén en los puntos clave o la respuesta modelo; si ella menciona un dato dudoso, dile que lo verifique.
${tipo === "oral" ? "Valora también si se entendería bien al decirlo a un cliente." : ""}
Responde solo con JSON: {"nota": número entero, "bien": [máx. 3 frases cortas], "falta": [máx. 3 frases cortas], "corrige": [máx. 2 frases cortas, vacío si no hay errores], "consejo": "una frase"}`;
  ctlEval = new AbortController();
  try{
    const r = await sampleFn.json(prompt, { signal: ctlEval.signal });
    const nota = Math.max(0, Math.min(20, Math.round(Number(r.nota) || 0)));
    guardarEval(s, tipo, nota);
    const lista = (t, a) => Array.isArray(a) && a.length ? `<h4>${t}</h4><ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
    res.innerHTML = `<div class="expl bloque-eval"><div class="nota"><span class="cifra">${nota}<small>/20</small></span><span class="sello ${nota>=11?'ok':'mal'}">${nota>=11?'CONFORME':'OBSERVADO'}</span></div>
      ${lista("Lo que hiciste bien", r.bien)}${lista("Lo que faltó", r.falta)}${lista("Para corregir", r.corrige)}
      ${r.consejo ? `<p style="margin-top:10px"><b>Consejo:</b> ${esc(r.consejo)}</p>` : ""}
      <details style="margin-top:10px"><summary>Ver respuesta modelo</summary><div class="modelo">${esc(it.modelo)}</div></details>
      ${botonSeguir(tipo)}</div>`;
  }catch(e){
    if (e && e.code === "cancelled") { btn.disabled = false; res.innerHTML = ""; return; }
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared" || e.code === "capability_disabled")) sampleFn = null;
    const msg = e && e.code === "rate_limited" ? "Claude está ocupado por ahora. Compárate con la respuesta modelo y vuelve a intentarlo luego." : "No se pudo revisar esta vez. Mientras tanto, compárate con la respuesta modelo.";
    autoevaluar(s, tipo, texto, msg);
  }
  btn.disabled = false; enlazarSeguir(tipo);
}
function autoevaluar(s, tipo, texto, aviso){
  const it = s[tipo], res = $("#resultado");
  res.innerHTML = `<div class="expl">${aviso ? `<p class="suave">${esc(aviso)}</p>` : ""}<p><b>Marca los puntos que tocaste:</b></p>
    <div class="chequeo">${it.puntos.map((p,i) => `<label><input type="checkbox" id="pt-${i}"><span>${esc(p)}</span></label>`).join("")}</div>
    <div class="modelo"><span class="eti">Respuesta modelo</span><br>${esc(it.modelo)}</div>
    <div class="acciones"><button class="btn ancho" id="calif">Calcular mi nota</button></div><div id="autonota"></div></div>`;
  $("#calif").onclick = () => {
    const n = it.puntos.filter((_,i) => $("#pt-" + i).checked).length;
    const nota = Math.round(n / it.puntos.length * 20); guardarEval(s, tipo, nota);
    $("#autonota").innerHTML = `<div class="nota"><span class="cifra">${nota}<small>/20</small></span><span class="sello ${nota>=11?'ok':'mal'}">${nota>=11?'CONFORME':'OBSERVADO'}</span></div>${botonSeguir(tipo)}`;
    enlazarSeguir(tipo);
  };
}
function guardarEval(s, tipo, nota){ P.evals[S.id + "-" + tipo] = { nota, fecha: new Date().toISOString().slice(0,10) }; guardar(); }
function botonSeguir(tipo){ return `<div class="acciones" style="margin-bottom:0"><button class="btn ancho" data-seguir="1">${tipo === "oral" ? 'Terminar la sesión' : 'Seguir: explicarlo en voz alta'}</button></div>`; }
function enlazarSeguir(tipo){ app.querySelectorAll("[data-seguir]").forEach(b => b.onclick = () => irPaso(tipo === "oral" ? "fin" : "decir")); }

function pasoFin(s){
  const h = P.hechas[S.id], e = P.evals[S.id + "-escrita"], o = P.evals[S.id + "-oral"];
  const nota = S.notaMarcar != null ? S.notaMarcar : (h ? h.nota : 0);
  const i = SESIONES.findIndex(x => x.id === S.id), sig = SESIONES[i+1];
  app.innerHTML = barraPasos() + `<div class="ficha resumen"><span class="eti">${esc(s.titulo)}</span>
    <div style="margin:14px 0"><span class="sello ${nota>=11?'ok':'mal'}">${nota>=11?'CONFORME':'OBSERVADO'}</span></div>
    <div class="tabla"><table><tbody>
      <tr><td>Preguntas para marcar</td><td class="r"><b>${nota}/20</b></td></tr>
      <tr><td>Respuesta escrita</td><td class="r">${e ? e.nota + '/20' : '—'}</td></tr>
      <tr><td>Explicación oral</td><td class="r">${o ? o.nota + '/20' : '—'}</td></tr></tbody></table></div>
    <p class="suave" style="margin-top:12px">${nota>=11 ? 'Bien. Las preguntas que fallaste quedan en Repaso.' : 'Vuelve a leer las fichas y repite la sesión cuando quieras; se guarda tu mejor nota.'}</p></div>
    <div class="acciones">${sig ? `<button class="btn ancho" onclick="S=null;location.hash='sesion-${sig.id}'">Siguiente: ${esc(sig.titulo)}</button>` : ''}
    <button class="btn sec ancho" onclick="S=null;location.hash=''">Volver a la ruta</button>
    <button class="btn bajo" onclick="S=null;abrirSesion('${s.id}')">Repetir</button></div>`;
}

/* ---------- Voz (lectura en voz alta) ---------- */
let hablando = false;
function pararVoz(){ try{ if (hablando) speechSynthesis.cancel(); }catch(e){} hablando = false; try{ if (reco) reco.stop(); }catch(e){} }
function alternarVoz(s, btn){
  try{
    if (hablando){ pararVoz(); btn.textContent = "Escuchar las fichas"; return; }
    const tmp = document.createElement("div");
    const texto = s.fichas.map(f => { tmp.innerHTML = f.t + ". " + f.p.join(" ") + (f.ej ? " Ejemplo. " + f.ej : "") + (f.arbol ? " " + f.arbol.map(r => r[0] + ". " + r[1] + ". " + r[2]).join(" ") : ""); return tmp.textContent; }).join(" ... ") + (s.ojo ? " ... Ojo. " + s.ojo : "");
    const u = new SpeechSynthesisUtterance(texto.replace(/m²/g," metros cuadrados"));
    const voces = speechSynthesis.getVoices(); const v = voces.find(x => /es[-_]PE/i.test(x.lang)) || voces.find(x => /^es/i.test(x.lang)); if (v) u.voice = v;
    u.lang = v ? v.lang : "es-PE"; u.rate = 1;
    u.onend = () => { hablando = false; btn.textContent = "Escuchar las fichas"; };
    speechSynthesis.cancel(); speechSynthesis.speak(u); hablando = true; btn.textContent = "Detener la lectura";
  }catch(e){ btn.hidden = true; }
}

/* ---------- Glosario ---------- */
let G = { q:"", m:"todo", tarjetas:false, i:0, vuelta:false };
function vistaGlosario(){
  cab("Glosario", false); marcarNav("glosario");
  const mods = [["todo","Todo"], ...MODULOS.map(m => [m.id, m.titulo])];
  app.innerHTML = `<h2>Términos</h2><p class="suave">${GLOSARIO.length} palabras que vas a oír en la oficina, en la municipalidad y en SUNARP.</p>
    <input class="buscar" id="buscar" type="search" placeholder="Buscar un término…" value="${esc(G.q)}">
    <div class="filtros">${mods.map(([id,t]) => `<button class="filtro ${G.m===id?'on':''}" data-m="${id}">${esc(t)}</button>`).join("")}
      <button class="filtro ${G.tarjetas?'on':''}" id="modo">${G.tarjetas ? 'Ver lista' : 'Tarjetas'}</button></div>
    <div id="glo"></div>`;
  $("#buscar").oninput = e => { G.q = e.target.value; G.i = 0; pintarGlosario(); };
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { G.m = b.dataset.m; G.i = 0; vistaGlosario(); });
  $("#modo").onclick = () => { G.tarjetas = !G.tarjetas; G.i = 0; G.vuelta = false; vistaGlosario(); };
  pintarGlosario();
}
function pintarGlosario(){
  const q = G.q.trim().toLowerCase();
  const lista = GLOSARIO.filter(g => (G.m === "todo" || g[2] === G.m) && (!q || (g[0] + " " + g[1]).toLowerCase().includes(q)));
  const caja = $("#glo");
  if (!lista.length){ caja.innerHTML = `<div class="vacio">No hay términos con «${esc(G.q)}».</div>`; return; }
  if (!G.tarjetas){ caja.innerHTML = lista.map(g => `<div class="termino"><b>${esc(g[0])}</b><p>${esc(g[1])}</p></div>`).join(""); return; }
  G.i = Math.min(G.i, lista.length - 1); const g = lista[G.i];
  caja.innerHTML = `<button class="tarjeta" id="carta" aria-label="Voltear la tarjeta"><span class="eti">${G.i+1} de ${lista.length} · toca para ${G.vuelta?'ocultar':'ver'}</span>
      <span class="t">${esc(g[0])}</span>${G.vuelta ? `<span class="d">${esc(g[1])}</span>` : `<span class="d suave">¿Qué significa?</span>`}</button>
    <div class="acciones"><button class="btn sec ancho" id="ant" ${G.i===0?'disabled':''}>Anterior</button><button class="btn ancho" id="sigt" ${G.i===lista.length-1?'disabled':''}>Siguiente</button></div>`;
  $("#carta").onclick = () => { G.vuelta = !G.vuelta; pintarGlosario(); };
  $("#ant").onclick = () => { G.i--; G.vuelta = false; pintarGlosario(); };
  $("#sigt").onclick = () => { G.i++; G.vuelta = false; pintarGlosario(); };
}

/* ---------- Repaso de errores ---------- */
let R = null;
function vistaRepaso(){
  cab("Repaso", false); marcarNav("repaso");
  const ids = Object.keys(P.errores).filter(id => { const [sid, i] = id.split("-"); return porId(sid) && porId(sid).preguntas[+i]; });
  if (!ids.length){ app.innerHTML = `<h2>Repaso</h2><div class="vacio"><p>No tienes preguntas pendientes.</p><p>Cuando falles una en una sesión, aparecerá aquí para que la vuelvas a intentar.</p></div>`; R = null; return; }
  if (!R || !R.lista.length) R = { lista: ids, i: 0, orden: null, hecha: false };
  const id = R.lista[R.i]; const [sid, qi] = id.split("-"); const s = porId(sid), q = s.preguntas[+qi];
  if (!R.orden) R.orden = barajar(q.ops.length);
  app.innerHTML = `<h2>Repaso</h2><p class="suave">${ids.length} pregunta${ids.length>1?'s':''} por corregir. Si aciertas, sale de la lista.</p>
    <div class="preg"><span class="eti">${esc(s.titulo)}</span><p class="q">${esc(q.q)}</p><div class="ops">
    ${R.orden.map((oi,k) => `<button class="op" data-oi="${oi}"><span class="l">${LETRAS[k]})</span><span>${esc(q.ops[oi])}</span></button>`).join("")}</div><div id="fb"></div></div>`;
  app.querySelectorAll(".op").forEach(b => b.onclick = () => {
    if (R.hecha) return; R.hecha = true;
    const oi = +b.dataset.oi, bien = oi === q.ok;
    app.querySelectorAll(".op").forEach(x => { x.disabled = true; if (+x.dataset.oi === q.ok) x.classList.add("correcta"); });
    b.classList.add("elegida", bien ? "bien" : "malo");
    if (bien){ delete P.errores[id]; guardar(); }
    $("#fb").innerHTML = `<div class="expl"><span class="sello ${bien?'ok':'mal'}">${bien?'CONFORME':'OBSERVADO'}</span><p>${esc(q.exp)}</p><div class="acciones" style="margin-bottom:0"><button class="btn ancho" id="sigr">Siguiente</button></div></div>`;
    $("#sigr").onclick = () => { R.lista = R.lista.filter(x => P.errores[x]); if (bien) { R.i = R.i % Math.max(R.lista.length,1); } else { R.i = (R.i + 1) % R.lista.length; } R.orden = null; R.hecha = false; vistaRepaso(); };
  });
}
